name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: cmake -S . -B "$RUNNER_TEMP/hashcollect-build" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build "$RUNNER_TEMP/hashcollect-build" --config Release

      - name: Test
        run: ctest --test-dir "$RUNNER_TEMP/hashcollect-build" --output-on-failure
